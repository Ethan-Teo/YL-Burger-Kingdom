<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fight Game</title>
<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:sans-serif;
}
canvas{
  background:#1a1a1a;
  border:3px solid #444;
  margin-top:20px;
}
</style>
</head>

<body>

<h2>Diddy vs Epstein</h2>
<p>Move: ⬅️ ➡️ | Punch: SPACE</p>

<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const player = {x:120,y:260,w:60,h:100,hp:100};
const enemy = {x:620,y:260,w:60,h:100,hp:100};

let keys = {};
let punching = false;

document.addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.code==="Space") punching=true;
});

document.addEventListener("keyup",e=>{
  keys[e.key]=false;
});

function drawFighter(x,y,color){

  // body
  ctx.fillStyle=color;
  ctx.fillRect(x,y,40,60);

  // head
  ctx.fillStyle="#ffd6a5";
  ctx.fillRect(x+8,y-20,24,20);

  // legs
  ctx.fillStyle=color;
  ctx.fillRect(x,y+60,15,40);
  ctx.fillRect(x+25,y+60,15,40);

}

function update(){

  if(keys["ArrowRight"]) player.x+=5;
  if(keys["ArrowLeft"]) player.x-=5;

  // enemy AI follow
  if(enemy.x>player.x) enemy.x-=2;
  else enemy.x+=2;

  // player punch
  if(punching && Math.abs(player.x-enemy.x)<70){
    enemy.hp-=5;
    punching=false;
  }

  // enemy punch
  if(Math.abs(player.x-enemy.x)<60 && Math.random()<0.03){
    player.hp-=4;
  }

}

function draw(){

  ctx.clearRect(0,0,800,400);

  // ground
  ctx.fillStyle="#333";
  ctx.fillRect(0,350,800,50);

  drawFighter(player.x,player.y,"cyan");
  drawFighter(enemy.x,enemy.y,"orange");

  // health bars
  ctx.fillStyle="red";
  ctx.fillRect(40,40,player.hp*2,20);
  ctx.fillRect(560,40,enemy.hp*2,20);

  ctx.fillStyle="white";
  ctx.fillText("Player",40,30);
  ctx.fillText("Enemy",560,30);

}

function loop(){

  update();
  draw();

  if(player.hp<=0){
    alert("Enemy wins");
    location.reload();
  }

  if(enemy.hp<=0){
    alert("You win");
    location.reload();
  }

  requestAnimationFrame(loop);

}

loop();
</script>

</body>
</html>
